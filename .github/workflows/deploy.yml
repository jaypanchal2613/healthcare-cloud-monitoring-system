
name: Healthcare Application CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: CI - Validate Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python syntax
        run: |
          python -m compileall -q app monitoring
          echo "Python syntax validation successful."

  deploy:
    name: CD - Deploy to AWS EC2
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy application through AWS SSM
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_COMMAND="sudo -u ssm-user bash -lc 'cd /home/ssm-user/healthcare-cloud-project && git pull origin main && sudo docker compose up -d --build healthcare-app && sleep 10 && curl -fsS http://127.0.0.1/health'"

          PARAMETERS=$(jq -n --arg cmd "$DEPLOY_COMMAND" '{commands: [$cmd]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-07beca54750d8701e" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions healthcare application deployment" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM deployment command submitted."

          STATUS="Pending"

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-07beca54750d8701e" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                break
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
            esac

            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-07beca54750d8701e" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed or timed out."
            exit 1
          fi

          echo "Deployment completed successfully."
